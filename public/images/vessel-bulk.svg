<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bulkSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="bulkSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <rect width="600" height="260" fill="url(#bulkSky)" />
  <rect y="260" width="600" height="140" fill="url(#bulkSea)" />

  <!-- Bulk Carrier Hull -->
  <path d="M 60 260 L 100 215 L 480 215 L 530 235 L 510 260 Z" fill="#1e293b" />
  <path d="M 480 215 L 535 235 L 545 260 L 510 260 Z" fill="#b91c1c" />
  <rect x="90" y="252" width="420" height="8" fill="#ef4444" />

  <!-- Aft Accommodation Superstructure -->
  <rect x="110" y="145" width="70" height="70" rx="2" fill="#f8fafc" />
  <rect x="120" y="125" width="50" height="20" rx="1" fill="#f1f5f9" />
  <rect x="125" y="130" width="40" height="7" rx="1" fill="#0284c7" />
  <!-- Funnel -->
  <polygon points="138,98 152,98 155,125 135,125" fill="#dc2626" />
  <rect x="137" y="104" width="16" height="5" fill="#1e293b" />
  <line x1="145" y1="98" x2="145" y2="78" stroke="#334155" stroke-width="2" />

  <!-- Cargo Hatches (Bulker characteristic) -->
  <rect x="200" y="202" width="45" height="13" rx="2" fill="#475569" stroke="#334155" stroke-width="1.5" />
  <rect x="260" y="202" width="45" height="13" rx="2" fill="#475569" stroke="#334155" stroke-width="1.5" />
  <rect x="320" y="202" width="45" height="13" rx="2" fill="#475569" stroke="#334155" stroke-width="1.5" />
  <rect x="380" y="202" width="45" height="13" rx="2" fill="#475569" stroke="#334155" stroke-width="1.5" />
  <rect x="440" y="202" width="45" height="13" rx="2" fill="#475569" stroke="#334155" stroke-width="1.5" />

  <!-- Deck Cranes -->
  <line x1="250" y1="215" x2="250" y2="160" stroke="#cbd5e1" stroke-width="3" />
  <line x1="250" y1="170" x2="230" y2="185" stroke="#cbd5e1" stroke-width="2" />
  <line x1="310" y1="215" x2="310" y2="160" stroke="#cbd5e1" stroke-width="3" />
  <line x1="310" y1="170" x2="340" y2="185" stroke="#cbd5e1" stroke-width="2" />
  <line x1="370" y1="215" x2="370" y2="160" stroke="#cbd5e1" stroke-width="3" />
  <line x1="370" y1="170" x2="400" y2="185" stroke="#cbd5e1" stroke-width="2" />
  <line x1="430" y1="215" x2="430" y2="160" stroke="#cbd5e1" stroke-width="3" />

  <!-- Waves -->
  <path d="M 0 260 Q 150 255, 300 260 T 600 260 L 600 265 Q 450 262, 300 265 T 0 265 Z" fill="#38bdf8" opacity="0.3" />
  <path d="M 40 268 Q 200 264, 400 268 T 580 268" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />

  <!-- Badge label -->
  <rect x="20" y="20" width="140" height="32" rx="6" fill="#0b1b3d" opacity="0.85" />
  <text x="90" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">BULK CARRIER</text>
</svg>
