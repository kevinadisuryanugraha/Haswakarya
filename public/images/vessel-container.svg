<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="contSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="contSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>

  <rect width="600" height="260" fill="url(#contSky)" />
  <rect y="260" width="600" height="140" fill="url(#contSea)" />

  <!-- Container Ship Hull -->
  <path d="M 50 260 L 90 220 L 510 220 L 550 240 L 530 260 Z" fill="#0f172a" />
  <path d="M 510 220 L 555 240 L 565 260 L 530 260 Z" fill="#b91c1c" />
  <rect x="80" y="252" width="450" height="8" fill="#dc2626" />

  <!-- Bridge & Accommodation -->
  <rect x="110" y="110" width="65" height="110" rx="2" fill="#ffffff" />
  <rect x="115" y="90" width="55" height="20" rx="1" fill="#f1f5f9" />
  <rect x="120" y="96" width="45" height="7" rx="1" fill="#0284c7" />
  <!-- Funnel -->
  <polygon points="135,62 150,62 153,90 133,90" fill="#dc2626" />
  <rect x="134" y="68" width="17" height="6" fill="#0f172a" />
  <line x1="142" y1="62" x2="142" y2="40" stroke="#f8fafc" stroke-width="2" />

  <!-- Stacked Containers (Multi-tier) -->
  <!-- Bay 1 -->
  <rect x="185" y="180" width="55" height="40" fill="#2563eb" />
  <rect x="187" y="145" width="51" height="35" fill="#dc2626" />
  <rect x="189" y="115" width="47" height="30" fill="#16a34a" />

  <!-- Bay 2 -->
  <rect x="245" y="180" width="55" height="40" fill="#d97706" />
  <rect x="247" y="145" width="51" height="35" fill="#0284c7" />
  <rect x="249" y="115" width="47" height="30" fill="#475569" />
  <rect x="251" y="90" width="43" height="25" fill="#ea580c" />

  <!-- Bay 3 -->
  <rect x="305" y="180" width="55" height="40" fill="#16a34a" />
  <rect x="307" y="145" width="51" height="35" fill="#2563eb" />
  <rect x="309" y="115" width="47" height="30" fill="#dc2626" />
  <rect x="311" y="90" width="43" height="25" fill="#0284c7" />

  <!-- Bay 4 -->
  <rect x="365" y="180" width="55" height="40" fill="#475569" />
  <rect x="367" y="145" width="51" height="35" fill="#d97706" />
  <rect x="369" y="115" width="47" height="30" fill="#16a34a" />

  <!-- Bay 5 -->
  <rect x="425" y="180" width="55" height="40" fill="#0284c7" />
  <rect x="427" y="145" width="51" height="35" fill="#dc2626" />
  <rect x="429" y="125" width="47" height="20" fill="#2563eb" />

  <!-- Bow lashing bridges -->
  <line x1="495" y1="220" x2="495" y2="150" stroke="#94a3b8" stroke-width="2" />
  <line x1="535" y1="240" x2="535" y2="200" stroke="#94a3b8" stroke-width="2" />

  <!-- Waves -->
  <path d="M 0 260 Q 150 255, 300 260 T 600 260 L 600 265 Q 450 262, 300 265 T 0 265 Z" fill="#38bdf8" opacity="0.3" />

  <!-- Badge label -->
  <rect x="20" y="20" width="155" height="32" rx="6" fill="#0b1b3d" opacity="0.85" />
  <text x="97" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CONTAINER VESSEL</text>
</svg>
