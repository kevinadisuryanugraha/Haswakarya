<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tugSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="tugSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="600" height="260" fill="url(#tugSky)" />
  <rect y="260" width="600" height="140" fill="url(#tugSea)" />

  <!-- Tug Boat (foreground) -->
  <!-- Hull -->
  <path d="M 120 260 L 150 210 L 320 210 L 350 230 L 330 260 Z" fill="#0f172a" />
  <path d="M 320 210 L 355 230 L 360 260 L 330 260 Z" fill="#b91c1c" />
  <!-- Bow Fender Rubber Tire -->
  <ellipse cx="350" cy="235" rx="10" ry="16" fill="#1e293b" stroke="#000000" stroke-width="2" />
  <circle cx="350" cy="235" r="5" fill="#334155" />

  <!-- Tug Wheelhouse -->
  <rect x="180" y="145" width="80" height="65" rx="3" fill="#ffffff" />
  <rect x="190" y="115" width="60" height="30" rx="3" fill="#f1f5f9" />
  <!-- 360-degree Wheelhouse Windows -->
  <rect x="193" y="122" width="54" height="10" rx="1" fill="#0284c7" />
  <!-- Funnel Twin Exhaust -->
  <rect x="168" y="130" width="8" height="35" rx="2" fill="#e11d48" />
  <rect x="156" y="130" width="8" height="35" rx="2" fill="#e11d48" />
  <!-- Searchlight & Mast -->
  <line x1="220" y1="115" x2="220" y2="85" stroke="#475569" stroke-width="3" />
  <line x1="210" y1="95" x2="230" y2="95" stroke="#475569" stroke-width="2" />
  <circle cx="220" cy="85" r="3" fill="#f59e0b" />

  <!-- Towing Winch on Aft Deck -->
  <rect x="145" y="195" width="22" height="15" rx="2" fill="#475569" />
  <circle cx="156" cy="202" r="5" fill="#94a3b8" />

  <!-- Towline connected to offshore barge behind -->
  <path d="M 145 200 Q 90 220 20 230" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-dasharray="4,2" />

  <!-- Offshore Deck Cargo Barge (in background) -->
  <rect x="380" y="230" width="180" height="30" rx="2" fill="#334155" />
  <rect x="390" y="210" width="60" height="20" fill="#f59e0b" />
  <rect x="460" y="200" width="45" height="30" fill="#2563eb" />
  <rect x="515" y="215" width="35" height="15" fill="#dc2626" />

  <!-- Wake and spray -->
  <ellipse cx="360" cy="262" rx="30" ry="6" fill="#ffffff" opacity="0.6" />
  <ellipse cx="115" cy="265" rx="40" ry="8" fill="#ffffff" opacity="0.5" />

  <!-- Waves -->
  <path d="M 0 260 Q 150 255, 300 260 T 600 260 L 600 265 Q 450 262, 300 265 T 0 265 Z" fill="#38bdf8" opacity="0.3" />

  <!-- Badge label -->
  <rect x="20" y="20" width="180" height="32" rx="6" fill="#0b1b3d" opacity="0.85" />
  <text x="110" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">TUG BOAT &amp; OFFSHORE</text>
</svg>
