<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="mlcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" />
  
  <!-- Outer Badge Circle -->
  <circle cx="200" cy="200" r="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#mlcShadow)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Inner Seal -->
  <circle cx="200" cy="200" r="105" fill="#064e3b" />

  <!-- Shield Icon -->
  <path d="M 200 115 L 225 125 C 225 155 200 170 200 170 C 200 170 175 155 175 125 Z" fill="#34d399" />
  <path d="M 193 138 L 198 145 L 208 132" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Certificate Text -->
  <text x="200" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MLC</text>
  <text x="200" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#6ee7b7" text-anchor="middle">2006</text>
  <line x1="130" y1="236" x2="270" y2="236" stroke="#fbbf24" stroke-width="2" />
  <text x="200" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">MARITIME LABOUR CONVENTION</text>
  <text x="200" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#a7f3d0" text-anchor="middle">ILO COMPLIANT RECRUITMENT</text>

  <!-- Bottom Banner -->
  <rect x="100" y="284" width="200" height="26" rx="13" fill="#059669" />
  <text x="200" y="301" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">HAK &amp; KESEJAHTERAAN CREW</text>
</svg>
