<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tankerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="tankerSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#061828" />
    </linearGradient>
  </defs>

  <rect width="600" height="260" fill="url(#tankerSky)" />
  <rect y="260" width="600" height="140" fill="url(#tankerSea)" />

  <!-- Tanker Hull (low freeboard when loaded, large beam) -->
  <path d="M 50 260 L 90 230 L 490 230 L 540 242 L 525 260 Z" fill="#334155" />
  <path d="M 490 230 L 545 242 L 555 260 L 525 260 Z" fill="#991b1b" />
  <rect x="80" y="254" width="445" height="6" fill="#ef4444" />

  <!-- Aft Superstructure -->
  <rect x="100" y="150" width="75" height="80" rx="2" fill="#f8fafc" />
  <rect x="110" y="128" width="55" height="22" rx="1" fill="#f1f5f9" />
  <rect x="115" y="134" width="45" height="7" rx="1" fill="#0284c7" />
  <!-- Funnel Twin Stacks or Large Stack -->
  <polygon points="128,102 148,102 152,128 124,128" fill="#e11d48" />
  <rect x="127" y="108" width="22" height="6" fill="#0f172a" />
  <line x1="138" y1="102" x2="138" y2="80" stroke="#f8fafc" stroke-width="2" />

  <!-- Tanker Pipe Racks & Manifolds (Tanker characteristic) -->
  <line x1="185" y1="225" x2="480" y2="225" stroke="#94a3b8" stroke-width="3" />
  <line x1="185" y1="222" x2="480" y2="222" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Walkway / Catwalk -->
  <rect x="180" y="215" width="300" height="3" fill="#e2e8f0" />
  <line x1="200" y1="215" x2="200" y2="230" stroke="#64748b" stroke-width="1.5" />
  <line x1="250" y1="215" x2="250" y2="230" stroke="#64748b" stroke-width="1.5" />
  <line x1="300" y1="215" x2="300" y2="230" stroke="#64748b" stroke-width="1.5" />
  <line x1="350" y1="215" x2="350" y2="230" stroke="#64748b" stroke-width="1.5" />
  <line x1="400" y1="215" x2="400" y2="230" stroke="#64748b" stroke-width="1.5" />
  <line x1="450" y1="215" x2="450" y2="230" stroke="#64748b" stroke-width="1.5" />

  <!-- Midship Hose Handling Crane (Manifold) -->
  <line x1="330" y1="230" x2="330" y2="175" stroke="#f59e0b" stroke-width="3" />
  <line x1="330" y1="185" x2="360" y2="195" stroke="#f59e0b" stroke-width="2" />
  <line x1="330" y1="185" x2="300" y2="195" stroke="#f59e0b" stroke-width="2" />

  <!-- Dome Vents & Expansion Trunks -->
  <circle cx="230" cy="227" r="4" fill="#64748b" />
  <circle cx="280" cy="227" r="4" fill="#64748b" />
  <circle cx="380" cy="227" r="4" fill="#64748b" />
  <circle cx="430" cy="227" r="4" fill="#64748b" />

  <!-- Waves -->
  <path d="M 0 260 Q 150 255, 300 260 T 600 260 L 600 265 Q 450 262, 300 265 T 0 265 Z" fill="#38bdf8" opacity="0.3" />

  <!-- Badge label -->
  <rect x="20" y="20" width="170" height="32" rx="6" fill="#0b1b3d" opacity="0.85" />
  <text x="105" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">OIL / CHEMICAL TANKER</text>
</svg>
