<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="isoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#f8fafc" />
  
  <!-- Outer Badge Circle -->
  <circle cx="200" cy="200" r="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#isoShadow)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#isoGrad)" stroke-width="6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Inner Seal -->
  <circle cx="200" cy="200" r="105" fill="#0b1b3d" />

  <!-- Star Accents -->
  <path d="M 200 115 L 202 121 L 208 121 L 203 124 L 205 130 L 200 126 L 195 130 L 197 124 L 192 121 L 198 121 Z" fill="#f59e0b" />
  
  <!-- Certificate Text -->
  <text x="200" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ISO</text>
  <text x="200" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">9001:2015</text>
  <line x1="130" y1="215" x2="270" y2="215" stroke="#f59e0b" stroke-width="2" />
  <text x="200" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">QUALITY MANAGEMENT</text>
  <text x="200" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle">CERTIFIED SYSTEM</text>

  <!-- Curving text placeholder or bottom banner -->
  <rect x="110" y="278" width="180" height="26" rx="13" fill="#0284c7" />
  <text x="200" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">STANDAR MUTU GLOBAL</text>
</svg>
