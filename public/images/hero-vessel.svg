<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="60%" stop-color="#0b1b3d" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102a45" />
      <stop offset="100%" stop-color="#071626" />
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b133" />
      <stop offset="100%" stop-color="#c59a00" />
    </linearGradient>
  </defs>

  <!-- Sky & Stars -->
  <rect width="800" height="350" fill="url(#skyGrad)" />
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="280" cy="60" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="450" cy="110" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="680" cy="70" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="730" cy="130" r="1" fill="#ffffff" opacity="0.3" />

  <!-- Sea -->
  <rect y="350" width="800" height="150" fill="url(#seaGrad)" />
  <!-- Wave Highlights -->
  <path d="M 0 350 Q 200 345, 400 350 T 800 350 L 800 356 Q 600 352, 400 356 T 0 356 Z" fill="#38bdf8" opacity="0.25" />
  <path d="M 0 375 Q 180 370, 360 375 T 720 375 L 800 375 L 800 378 Q 540 374, 360 378 T 0 378 Z" fill="#38bdf8" opacity="0.15" />

  <!-- Cargo Vessel Silhouette -->
  <!-- Hull -->
  <path d="M 120 350 L 170 310 L 640 310 L 670 330 L 660 350 Z" fill="url(#shipGrad)" />
  <!-- Bulbous Bow waterline -->
  <path d="M 640 310 L 675 328 L 685 350 L 660 350 Z" fill="#991b1b" />
  <rect x="160" y="340" width="500" height="10" fill="#dc2626" opacity="0.8" />

  <!-- Bridge Superstructure (Stern) -->
  <rect x="180" y="220" width="90" height="90" rx="3" fill="#f8fafc" />
  <rect x="190" y="200" width="70" height="20" rx="2" fill="#f1f5f9" />
  <rect x="205" y="170" width="40" height="30" rx="2" fill="#e2e8f0" />
  <!-- Bridge Windows -->
  <rect x="195" y="205" width="60" height="8" rx="1" fill="#0284c7" opacity="0.8" />
  <!-- Chimney / Funnel -->
  <polygon points="215,145 235,145 238,170 212,170" fill="#dc2626" />
  <rect x="214" y="152" width="23" height="6" fill="#1e293b" />
  <rect x="214" y="145" width="21" height="3" fill="#000000" />

  <!-- Radar Mast -->
  <line x1="225" y1="145" x2="225" y2="120" stroke="#f8fafc" stroke-width="2" />
  <line x1="215" y1="125" x2="235" y2="125" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="220" y1="132" x2="230" y2="132" stroke="#f8fafc" stroke-width="1.5" />

  <!-- Containers on Deck -->
  <rect x="285" y="270" width="70" height="40" rx="2" fill="#2563eb" />
  <rect x="288" y="230" width="65" height="40" rx="2" fill="#dc2626" />
  
  <rect x="365" y="270" width="70" height="40" rx="2" fill="#16a34a" />
  <rect x="368" y="230" width="65" height="40" rx="2" fill="#d97706" />

  <rect x="445" y="270" width="70" height="40" rx="2" fill="#0284c7" />
  <rect x="448" y="230" width="65" height="40" rx="2" fill="#475569" />

  <rect x="525" y="270" width="70" height="40" rx="2" fill="#dc2626" />
  <rect x="528" y="230" width="65" height="40" rx="2" fill="#2563eb" />

  <!-- Cranes / Masts -->
  <line x1="360" y1="310" x2="360" y2="200" stroke="#cbd5e1" stroke-width="3" />
  <line x1="360" y1="210" x2="330" y2="230" stroke="#cbd5e1" stroke-width="2" />
  <line x1="440" y1="310" x2="440" y2="200" stroke="#cbd5e1" stroke-width="3" />
  <line x1="440" y1="210" x2="470" y2="230" stroke="#cbd5e1" stroke-width="2" />
  <line x1="520" y1="310" x2="520" y2="200" stroke="#cbd5e1" stroke-width="3" />

  <!-- Deck Railing -->
  <line x1="270" y1="305" x2="630" y2="305" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Glow and Light Effects -->
  <circle cx="200" cy="209" r="2" fill="#fef08a" />
  <circle cx="215" cy="209" r="2" fill="#fef08a" />
  <circle cx="230" cy="209" r="2" fill="#fef08a" />
  <circle cx="245" cy="209" r="2" fill="#fef08a" />

  <!-- Water reflection -->
  <ellipse cx="400" cy="365" rx="250" ry="8" fill="#38bdf8" opacity="0.1" />
</svg>
